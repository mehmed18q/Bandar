name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libnss3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcomposite1 libxdamage1 libxtst6 libasound2t64
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Lint
        run: |
          .venv/bin/ruff check bandar tests scripts
          .venv/bin/ruff format --check bandar tests scripts
      - name: Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests -t . -v
      - name: Interface tests
        run: node --test tests/js/*.test.cjs
