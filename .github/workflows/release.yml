name: Build and publish the Ubuntu package and site

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package to GitHub Releases and Pages
        type: boolean
        default: false
  push:
    tags:
      - 'v*-*'

permissions:
  contents: read

concurrency:
  group: bandar-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and test on Ubuntu 24.04
        run: python3 scripts/build_ubuntu24.py
      - name: Install on a clean Ubuntu 24.04 image
        run: |
          docker run --rm --init --mount "type=bind,source=$PWD/dist,target=/packages,readonly" \
            ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517 \
            sh -c 'apt-get update -qq && apt-get install -y --no-install-recommends /packages/*.deb >/tmp/install.log && QT_QPA_PLATFORM=offscreen bandar --version'
      - name: Upload tested installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bandar-ubuntu24
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bandar-ubuntu24
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gnupg
      - name: Import repository signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          test -n "$APT_SIGNING_KEY"
          install -d -m 0700 "$RUNNER_TEMP/bandar-gnupg"
          printf '%s' "$APT_SIGNING_KEY" | gpg --homedir "$RUNNER_TEMP/bandar-gnupg" --batch --import
          install -m 0600 /dev/null "$RUNNER_TEMP/bandar-passphrase"
          printf '%s' "$APT_SIGNING_PASSPHRASE" > "$RUNNER_TEMP/bandar-passphrase"
      - name: Create the site and signed APT repository
        env:
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/create_apt_repository.py dist/*.deb --output dist/apt \
            --url "$PAGES_URL" --key "$APT_SIGNING_FINGERPRINT" \
            --gnupghome "$RUNNER_TEMP/bandar-gnupg" \
            --passphrase-file "$RUNNER_TEMP/bandar-passphrase"
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import sys; sys.path[:0] = [".", "scripts"]; from bandar import VERSION; from linux_build_support import DEBIAN_REVISION; print(VERSION + "-" + DEBIAN_REVISION)')
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "The tag does not match the application/package version" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.deb dist/*.sha256 --target "$GITHUB_SHA" \
              --title "Bandar $version — Ubuntu 24.04+" --notes-file CHANGELOG.md
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/apt
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Remove signing material
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/bandar-gnupg" --kill gpg-agent || true
          rm -rf "$RUNNER_TEMP/bandar-gnupg" "$RUNNER_TEMP/bandar-passphrase"
